name: Build, Smoke & Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # smoke-registry opens an issue on failure

jobs:
  # ── macOS (ARM64 + x86_64) ─────────────────────────────────
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, macos-x64]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: macos-arm64
            os: macos-14
            architecture: arm64
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            architecture: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          sccache: "true"
      - name: Smoke wheel
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
          SMOKE_SCRIPT: ${{ github.workspace }}/ci/smoke/smoke.py
        run: bash ci/smoke/run-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python }}
          path: dist/*.whl

  # ── Linux (x86_64 + aarch64, manylinux) ───────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python${{ matrix.python }}
          manylinux: "2_28"
          before-script-linux: |
            # Install OpenSSL dev headers for native-tls (replaces ring/rustls)
            if command -v dnf > /dev/null; then
              dnf install -y openssl-devel pkgconfig
            elif command -v yum > /dev/null; then
              yum install -y openssl-devel pkgconfig
            elif command -v apt-get > /dev/null; then
              apt-get update && apt-get install -y libssl-dev pkg-config
            fi
            # maturin_2_28 images expose pythons at /opt/python/*/bin but not on PATH
            pyver="${{ matrix.python }}"
            pytag="cp${pyver//./}-cp${pyver//./}"
            ln -sf "/opt/python/$pytag/bin/python3" "/usr/local/bin/python$pyver"
          sccache: "true"
      - name: Smoke wheel
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
          SMOKE_SCRIPT: ${{ github.workspace }}/ci/smoke/smoke.py
        run: bash ci/smoke/run-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python }}
          path: dist/*.whl

  # ── Windows (x86_64) ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --interpreter python
          sccache: "true"
      - name: Smoke wheel
        shell: pwsh
        env:
          WHEEL_DIR: ${{ github.workspace }}\dist
          SMOKE_SCRIPT: ${{ github.workspace }}\ci\smoke\smoke.py
        run: pwsh ci/smoke/run-local.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64-py${{ matrix.python }}
          path: dist/*.whl

  # ── Source distribution ─────────────────────────────────────
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  # ── Verify all native wheel assets exist before smoke testing ──
  verify-wheels:
    name: Verify native wheel set
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Require every native wheel target
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(wheels/*.whl)
          if [ ${#wheels[@]} -ne 30 ]; then
            printf 'expected 30 wheels, found %d\n' "${#wheels[@]}"
            printf '%s\n' "${wheels[@]}"
            exit 1
          fi

          require_one() {
            local label="$1"
            shift
            local matches=("$@")
            if [ ${#matches[@]} -ne 1 ]; then
              printf 'expected one %s wheel, found %d\n' "$label" "${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi
          }

          for tag in cp39 cp310 cp311 cp312 cp313 cp314; do
            require_one "$tag macOS arm64" wheels/*-"$tag"-"$tag"-macosx_*_arm64.whl
            require_one "$tag macOS x64" wheels/*-"$tag"-"$tag"-macosx_*_x86_64.whl
            require_one "$tag manylinux arm64" wheels/*-"$tag"-"$tag"-manylinux_2_28_aarch64.whl
            require_one "$tag manylinux x64" wheels/*-"$tag"-"$tag"-manylinux_2_28_x86_64.whl
            require_one "$tag Windows x64" wheels/*-"$tag"-"$tag"-win_amd64.whl
          done

  # ── Publish to PyPI ─────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [sdist, verify-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/duroxide
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List wheels
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── Post-publish smoke: install from real PyPI on real OSes ──
  smoke-registry:
    name: Smoke (registry) ${{ matrix.platform }} py${{ matrix.python }}
    if: github.event_name == 'release'
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel
          - platform: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Normalize version (strip leading v)
        id: ver
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Run smoke (registry install)
        if: runner.os != 'Windows'
        env:
          DUROXIDE_VERSION: ${{ steps.ver.outputs.version }}
          SMOKE_SCRIPT:     ${{ github.workspace }}/ci/smoke/smoke.py
        run: bash ci/smoke/run-registry.sh
      - name: Run smoke (registry install, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DUROXIDE_VERSION: ${{ steps.ver.outputs.version }}
          SMOKE_SCRIPT:     ${{ github.workspace }}/ci/smoke/smoke.py
        run: pwsh ci/smoke/run-registry.ps1

  smoke-registry-report:
    name: Report registry smoke failure
    if: github.event_name == 'release' && failure() && needs.smoke-registry.result == 'failure'
    needs: [smoke-registry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Post-publish smoke FAILED for ${tag}`,
              body: [
                `Post-publish (PyPI registry) smoke failed for release \`${tag}\`.`,
                ``,
                `Run: ${runUrl}`,
                ``,
                `Consumers installing \`duroxide==${tag.replace(/^v/,'')}\` from PyPI may be broken on one or more platforms.`,
                `The release has NOT been auto-yanked. Action: investigate, patch, release a new version, and yank the bad one via PyPI UI if needed.`,
              ].join('\n'),
              labels: ['bug', 'release-smoke'],
            });
